name: Deploy NETCORE Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Website
        run: npm run build -- --base=/Learn-Networking/

      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
